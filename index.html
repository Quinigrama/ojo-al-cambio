<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14171a" />
  <meta name="description" content="Juego arcade de matemáticas rápidas y reflejos detrás del mostrador contra el timo del cambio." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>OJO AL CAMBIO — Simulador de Mostrador</title>
  <style>
    :root {
      --bg-dark: #14171a;
      --felt: #1e4d3b;
      --wood: #5c3a21;
      --wood-dark: #3d2514;
      --panel: #22272e;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --uv-glow: #a855f7;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg-dark);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }

    header {
      background: var(--panel);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #30363d;
      font-size: 0.85rem;
      z-index: 20;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stat-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge {
      background: #111418;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      font-weight: 700;
    }

    .badge span { color: var(--accent); }
    .badge.money span { color: var(--success); }
    .badge.day span { color: #38bdf8; }

    #timer-bar-wrap {
      width: 100%;
      height: 6px;
      background: #111;
    }
    #timer-bar {
      height: 100%;
      width: 100%;
      background: var(--success);
      transition: width 0.1s linear, background 0.3s;
    }

    #customer-area {
      background: linear-gradient(180deg, #1b2028 0%, #262d38 100%);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid var(--wood-dark);
      min-height: 84px;
      position: relative;
      z-index: 10;
    }

    .customer-info {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 72%;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      border: 2px solid #6b7280;
      flex-shrink: 0;
    }

    .speech-bubble {
      background: #fff;
      color: #111827;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      line-height: 1.25;
    }

    .product-tag {
      background: #fef3c7;
      color: #92400e;
      border: 2px dashed #f59e0b;
      padding: 6px 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: 800;
      flex-shrink: 0;
    }
    .product-tag small {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #counter {
      flex: 1;
      background: radial-gradient(circle at center, #25614a 0%, var(--felt) 100%);
      border-left: 10px solid var(--wood);
      border-right: 10px solid var(--wood);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      transition: filter 0.25s, box-shadow 0.25s;
    }

    #counter.uv-active {
      background: radial-gradient(circle at center, #2e1065 0%, #170836 100%);
      box-shadow: inset 0 0 60px rgba(168, 85, 247, 0.65);
    }

    .zone-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
    }

    .zone {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 14px 12px;
      padding: 10px 4px;
      min-height: 70px;
    }
    #player-zone {
      border-top: 2px dashed rgba(255,255,255,0.18);
    }

    .money-item {
      position: relative;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 6px 12px rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }
    .money-item.fresh { animation: dropIn 0.18s ease-out; }
    @keyframes dropIn {
      from { transform: translateY(-10px) scale(0.9); opacity: 0; }
      to { opacity: 1; }
    }
    .money-item:active { transform: scale(0.94); }
    @media (hover: hover) {
      .money-item:hover { transform: scale(1.06) translateY(-3px); }
    }

    /* Montón de piezas iguales: se ven capas detrás y un contador ×N */
    .money-item.stacked.bill { box-shadow: 4px 4px 0 -1px rgba(0,0,0,0.35), 8px 8px 0 -2px rgba(0,0,0,0.25), 0 6px 12px rgba(0,0,0,0.45); }
    .money-item.stacked.coin { box-shadow: 3px 3px 0 0 rgba(0,0,0,0.35), 6px 6px 0 0 rgba(0,0,0,0.22), 0 6px 12px rgba(0,0,0,0.45); }
    .count-badge {
      position: absolute;
      bottom: -9px;
      right: -9px;
      background: var(--accent);
      color: #111;
      font-size: 0.78rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 10px;
      border: 2px solid #111;
    }

    .bill {
      width: 92px;
      height: 48px;
      border-radius: 5px;
      border: 2px solid rgba(255,255,255,0.4);
      font-size: 1.12rem;
      color: #111;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    }

    .bill[data-val="5"]   { background: linear-gradient(135deg, #cbd5e1, #94a3b8); }
    .bill[data-val="10"]  { background: linear-gradient(135deg, #fca5a5, #f87171); }
    .bill[data-val="20"]  { background: linear-gradient(135deg, #93c5fd, #60a5fa); }
    .bill[data-val="50"]  { background: linear-gradient(135deg, #fdba74, #fb923c); }
    .bill[data-val="100"] { background: linear-gradient(135deg, #86efac, #4ade80); }

    .uv-mark {
      display: none;
      position: absolute;
      inset: 4px;
      border: 2px dashed #38bdf8;
      border-radius: 3px;
      pointer-events: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 0.72rem;
      color: #e0f2fe;
      text-shadow: 0 0 8px #38bdf8;
    }

    #counter.uv-active .bill.authentic .uv-mark { display: flex; }
    #counter.uv-active .bill.fake {
      filter: brightness(0.65) contrast(1.2);
      border-color: #ef4444;
    }

    .coin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 0.76rem;
      border: 2px solid rgba(0,0,0,0.35);
    }
    .coin.gold { background: radial-gradient(circle at 30% 30%, #fde047, #ca8a04); color: #422006; }
    .coin.silver { background: radial-gradient(circle at 30% 30%, #f1f5f9, #94a3b8); color: #0f172a; }
    .coin.copper { background: radial-gradient(circle at 30% 30%, #fdba74, #b45309); color: #fff; }

    .owner-badge {
      position: absolute;
      top: -8px;
      right: -6px;
      font-size: 0.6rem;
      padding: 1px 5px;
      border-radius: 4px;
      background: #111827;
      color: #fff;
      border: 1px solid #4b5563;
    }

    #thief-hand {
      position: absolute;
      top: -110px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3.4rem;
      cursor: pointer;
      z-index: 80;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6));
      transition: top 0.35s ease, left 0.35s ease, transform 0.15s;
      display: none;
    }
    #thief-hand.tease { top: -18px; animation: pulseHand 0.35s infinite alternate; }
    #thief-hand.grab { top: 32%; }

    @keyframes pulseHand {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.12); }
    }

    #register-area {
      background: var(--wood-dark);
      border-top: 4px solid var(--wood);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-uv { background: #4c1d95; color: #f3e8ff; border: 1px solid #a855f7; }
    .btn-uv.active { background: #9333ea; box-shadow: 0 0 14px #a855f7; }
    .btn-fake { background: #dc2626; color: #fff; }
    .btn-done { background: #10b981; color: #052e16; font-size: 0.94rem; padding: 10px 16px; }
    .btn-cancel { background: #475569; color: #f8fafc; border: 1px solid #94a3b8; }
    .btn-install { background: #2563eb; color: #fff; margin-top: 8px; width: 100%; display: none; }

    .drawer {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .drawer-slot {
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 6px;
      padding: 7px 4px;
      text-align: center;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
      color: #f9fafb;
    }
    .drawer-slot:hover { background: #374151; }
    .drawer-slot.bill-slot { border-bottom: 3px solid #f59e0b; }
    .drawer-slot.coin-slot { border-bottom: 3px solid #9ca3af; }

    #toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(17, 24, 39, 0.95);
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.05rem;
      border: 2px solid var(--accent);
      z-index: 150;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      text-align: center;
      max-width: 88%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
      overflow-y: auto;
    }

    .modal {
      background: #1f242d;
      border: 2px solid var(--accent);
      border-radius: 14px;
      max-width: 490px;
      width: 100%;
      padding: 22px;
      text-align: center;
    }
    .modal h1 { margin: 0 0 8px; color: var(--accent); font-size: 1.6rem; }
    .modal p { color: #d1d5db; font-size: 0.9rem; line-height: 1.45; margin: 6px 0; }

    .records-bar {
      display: flex;
      justify-content: space-around;
      background: #14181f;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px;
      margin: 12px 0;
      font-size: 0.85rem;
    }
    .records-bar b { color: var(--success); display: block; font-size: 1.05rem; }

    .rules-list {
      text-align: left;
      background: #14181f;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin: 12px 0;
      line-height: 1.5;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0;
      text-align: left;
    }

    .shop-card {
      background: #14181f;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .shop-card.owned { border-color: var(--success); opacity: 0.8; }
    .shop-card h4 { margin: 0; font-size: 0.86rem; color: #f9fafb; }
    .shop-card small { font-size: 0.74rem; color: #9ca3af; line-height: 1.3; }

    .mode-pick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .mode-pick .btn { width: 100%; font-size: 0.95rem; }
    .btn-relax { background: #0ea5e9; color: #04253a; }
    .mode-note { font-size: 0.75rem !important; color: #9ca3af !important; }
  </style>
</head>
<body>

  <header>
    <div class="stat-box">
      <div class="badge day">Día: <span id="hud-day">Lunes</span></div>
      <div class="badge money">Caja: <span id="hud-cash">200,00 €</span></div>
    </div>
    <div class="stat-box">
      <div class="badge">Turno: <span id="hud-client">1/4</span></div>
      <div class="badge">Racha: <span id="hud-streak">0</span></div>
    </div>
  </header>

  <div id="timer-bar-wrap"><div id="timer-bar"></div></div>

  <section id="customer-area">
    <div class="customer-info">
      <div class="avatar" id="cust-avatar">🧔</div>
      <div class="speech-bubble" id="cust-speech">Preparando mostrador...</div>
    </div>
    <div class="product-tag">
      <small id="prod-name">Producto</small>
      <span id="prod-price">0,00 €</span>
    </div>
  </section>

  <main id="counter">
    <div class="zone-label">▲ Dinero del cliente (pincha para cobrarlo)</div>
    <div class="zone" id="cust-zone"></div>
    <div id="thief-hand" title="¡Pincha su mano para frenarlo!">🖐️</div>
    <div class="zone" id="player-zone"></div>
    <div class="zone-label" style="text-align:right;">▼ Tu cambio (pincha una pieza para retirarla)</div>
  </main>

  <section id="register-area">
    <div class="controls-row">
      <button class="btn btn-uv" id="btn-uv" onclick="toggleUV()">🔦 LUZ UV (U)</button>
      <button class="btn btn-fake" onclick="reportFake()">🚫 ¡BILLETE FALSO!</button>
      <button class="btn btn-cancel" onclick="cancelSale()">🛑 ANULAR VENTA</button>
      <button class="btn btn-done" onclick="finishTransaction()">✅ CERRAR VENTA</button>
    </div>

    <div class="drawer">
      <div class="drawer-slot bill-slot" onclick="addChange(50)">50 €</div>
      <div class="drawer-slot bill-slot" onclick="addChange(20)">20 €</div>
      <div class="drawer-slot bill-slot" onclick="addChange(10)">10 €</div>
      <div class="drawer-slot bill-slot" onclick="addChange(5)">5 €</div>
      <div class="drawer-slot coin-slot" onclick="addChange(2)">2 €</div>
      <div class="drawer-slot coin-slot" onclick="addChange(1)">1 €</div>
      <div class="drawer-slot coin-slot" onclick="addChange(0.5)">0,50 €</div>
      <div class="drawer-slot coin-slot" onclick="addChange(0.2)">0,20 €</div>
      <div class="drawer-slot coin-slot" onclick="addChange(0.1)">0,10 €</div>
      <div class="drawer-slot coin-slot" onclick="clearMyChange()" style="background:#3f1d1d;">Limpiar</div>
    </div>
  </section>

  <div id="toast"></div>
  <div id="overlay"></div>

  <script>
    // Registro del Service Worker para funcionamiento Offline / PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btn-install-app');
      if (btn) btn.style.display = 'block';
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(() => {
        deferredPrompt = null;
        const btn = document.getElementById('btn-install-app');
        if (btn) btn.style.display = 'none';
      });
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', dur = 0.09, vol = 0.12) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    // baseTime = segundos base por cliente; además se suman segundos por cada pieza que necesite el cambio
    const DAYS = [
      { name: "Lunes", desc: "Mañana tranquila de barrio", clients: 4, baseTime: 30, scamChance: 0.30, fakeChance: 0.15 },
      { name: "Martes", desc: "Empiezan los billetes grandes", clients: 5, baseTime: 28, scamChance: 0.42, fakeChance: 0.20 },
      { name: "Miércoles", desc: "Día de recados y prisas", clients: 6, baseTime: 26, scamChance: 0.50, fakeChance: 0.22 },
      { name: "Jueves", desc: "Víspera animada", clients: 7, baseTime: 24, scamChance: 0.55, fakeChance: 0.25 },
      { name: "Viernes", desc: "Hora punta de tarde", clients: 8, baseTime: 22, scamChance: 0.62, fakeChance: 0.28 },
      { name: "Sábado", desc: "Mercadillo y gentío", clients: 9, baseTime: 20, scamChance: 0.68, fakeChance: 0.30 },
      { name: "Domingo", desc: "Cierre semanal — Máxima tensión", clients: 10, baseTime: 18, scamChance: 0.75, fakeChance: 0.32 }
    ];
    const SECONDS_PER_PIECE = 2.5;
    const DENOMS = [50, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1];

    const UPGRADES = [
      { id: "camera", name: "📹 Cámara HD", cost: 35, desc: "Frena un 35% la mano del timador." },
      { id: "clock", name: "🕰️ Reloj Tranquilo", cost: 40, desc: "+25% de tiempo extra por cliente." },
      { id: "scanner", name: "📡 Alerta UV", cost: 55, desc: "Pitido sutil si entra un billete falso." },
      { id: "tipjar", name: "🫙 Bote Deluxe", cost: 30, desc: "Duplica las propinas por cambio exacto." }
    ];

    const PRODUCTS = [
      { name: "Chicle", price: 1.20 },
      { name: "Periódico", price: 1.80 },
      { name: "Botella Agua", price: 1.50 },
      { name: "Mechero", price: 2.00 },
      { name: "Pilas AAA", price: 3.50 },
      { name: "Cafecito", price: 1.40 },
      { name: "Pan y Bollo", price: 2.60 },
      { name: "Refresco", price: 2.30 }
    ];

    const AVATARS = ["🧔", "🕵️", "👩‍🦱", "🧓", "👱‍♂️", "🧕", "🧢", "🕶️"];

    // Frases comunes para TODOS los clientes: así la frase no delata al que trae un billete falso
    const PAY_LINES = [
      (p, b) => `Buenas, me llevo ${p}. Aquí tienes ${b} €.`,
      (p, b) => `Dame ${p}, toma este billete de ${b} €.`,
      (p, b) => `Cóbrate ${p} de este de ${b} €, llevo prisa.`,
      (p, b) => `¿Me cobras ${p}? Solo llevo este de ${b} €, perdona.`,
      (p, b) => `Ponme ${p}. Te pago con ${b} €.`
    ];
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const STORAGE_KEY = "ojo_al_cambio_records_v1";
    function getRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { bestCash: 200, bestStreak: 0, weeksWon: 0 };
      } catch {
        return { bestCash: 200, bestStreak: 0, weeksWon: 0 };
      }
    }
    function saveRecords(cash, streak, weekCompleted = false) {
      if (state.relaxed) return; // el modo relajado no cuenta para récords
      const rec = getRecords();
      if (cash > rec.bestCash) rec.bestCash = +cash.toFixed(2);
      if (streak > rec.bestStreak) rec.bestStreak = streak;
      if (weekCompleted) rec.weeksWon += 1;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rec)); } catch {}
    }

    let state = {
      cash: 200.00,
      dayStartCash: 200.00,
      streak: 0,
      dayIdx: 0,
      clientInDay: 0,
      upgrades: {},
      uvOn: false,
      active: false,
      relaxed: false,
      timeLeft: 100,
      timerId: null,
      scamTimerId: null,
      handTimers: [],
      currentProduct: null,
      collectedFromCustomer: 0,
      itemsOnTable: [],
      hasFakeBill: false,
      fakeVal: 0,
      isScammer: false,
      handState: 'hidden'
    };

    const round2 = (n) => Math.round(n * 100) / 100;
    const fmt = (n) => n.toFixed(2).replace('.', ',') + ' €';

    // Número mínimo de piezas para dar un cambio (para calcular el tiempo justo)
    function piecesFor(amount) {
      let cents = Math.round(amount * 100), n = 0;
      for (const d of DENOMS) {
        const dc = Math.round(d * 100);
        n += Math.floor(cents / dc);
        cents %= dc;
      }
      return n;
    }

    function showToast(msg, color = '#f59e0b') {
      const t = document.getElementById('toast');
      t.innerHTML = msg;
      t.style.borderColor = color;
      t.style.opacity = '1';
      clearTimeout(t._hide);
      t._hide = setTimeout(() => { t.style.opacity = '0'; }, 1800);
    }

    function updateHUD() {
      const day = DAYS[state.dayIdx];
      document.getElementById('hud-day').textContent = day.name;
      document.getElementById('hud-cash').textContent = fmt(state.cash);
      document.getElementById('hud-streak').textContent = state.streak;
      document.getElementById('hud-client').textContent = `${state.clientInDay}/${day.clients}`;
    }

    function toggleUV() {
      state.uvOn = !state.uvOn;
      document.getElementById('counter').classList.toggle('uv-active', state.uvOn);
      document.getElementById('btn-uv').classList.toggle('active', state.uvOn);
      playTone(state.uvOn ? 520 : 280, 'triangle', 0.08);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'u' && state.active) toggleUV();
    });

    function showStartModal() {
      const rec = getRecords();
      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <div class="modal">
          <h1>👁️ OJO AL CAMBIO</h1>
          <p>Sobrevive a una semana completa detrás del mostrador sin que te descuadren la caja.</p>
          <div class="records-bar">
            <div>Récord Caja<b>${fmt(rec.bestCash)}</b></div>
            <div>Mejor Racha<b>${rec.bestStreak}</b></div>
            <div>Semanas<b>${rec.weeksWon}</b></div>
          </div>
          <div class="rules-list">
            • <b>Cobra:</b> pincha los billetes y monedas del cliente para guardarlos.<br>
            • <b>Prepara el cambio:</b> toca tu cajón; las piezas iguales se apilan con un contador ×N.<br>
            • <b>Vigila sus manos:</b> si su mano entra a robar o dar el cambiazo, <b>pínchala rápido</b>.<br>
            • <b>Anular venta:</b> si el cliente te la juega (recupera su billete, te lía con el cambio…), anula: le devuelves todo, no le das el producto y no pierdes nada. ¡Pero no anules a un cliente honrado!<br>
            • <b>Luz UV (tecla U):</b> los billetes buenos muestran la marca ★ EUR. Si no la tiene, ¡denúncialo!<br>
            • <b>Tiempo:</b> cuanto más cambio hay que dar, más tiempo tienes.
          </div>
          <div class="mode-pick">
            <button class="btn btn-done" onclick="startNewWeek(false)">⏱️ NORMAL</button>
            <button class="btn btn-relax" onclick="startNewWeek(true)">☕ RELAJADO</button>
          </div>
          <p class="mode-note">Relajado: sin reloj, para echar las cuentas con calma (no cuenta para récords).</p>
          <button id="btn-install-app" class="btn btn-install" style="${deferredPrompt ? 'display:block' : 'display:none'}" onclick="installPWA()">📲 INSTALAR APP EN DISPOSITIVO</button>
        </div>
      `;
      ov.style.display = 'flex';
    }

    function startNewWeek(relaxed = false) {
      state.relaxed = relaxed;
      state.cash = 200;
      state.dayStartCash = 200;
      state.streak = 0;
      state.dayIdx = 0;
      state.clientInDay = 0;
      state.upgrades = {};
      document.getElementById('timer-bar-wrap').style.visibility = relaxed ? 'hidden' : 'visible';
      document.getElementById('overlay').style.display = 'none';
      nextClient();
    }

    function spawnItemOnTable(val, owner, fake = false) {
      const id = 'item_' + Math.random().toString(36).slice(2, 9);
      const rot = owner === 'customer' ? +(Math.random() * 10 - 5).toFixed(1) : 0;
      state.itemsOnTable.push({ id, val, owner, fake, rot });
      state.lastAddedId = id;
      renderTable();
    }

    function buildPiece(val, fake, ownerLabel) {
      const el = document.createElement('div');
      const isBill = val >= 5;
      el.className = 'money-item ' + (isBill ? 'bill' : 'coin');
      if (isBill) {
        el.dataset.val = val;
        el.classList.add(fake ? 'fake' : 'authentic');
        el.innerHTML = `<span>${val} €</span><div class="uv-mark"><span>★ EUR</span><span>OK</span></div>`;
      } else {
        el.classList.add(val >= 1 ? 'gold' : (val >= 0.2 ? 'silver' : 'copper'));
        el.innerHTML = `<span>${val >= 1 ? val + '€' : Math.round(val * 100) + 'c'}</span>`;
      }
      if (ownerLabel) el.insertAdjacentHTML('beforeend', `<div class="owner-badge">${ownerLabel}</div>`);
      return el;
    }

    function renderTable() {
      const custZone = document.getElementById('cust-zone');
      const playerZone = document.getElementById('player-zone');
      custZone.innerHTML = '';
      playerZone.innerHTML = '';

      // Cliente: cada pieza por separado
      state.itemsOnTable.filter(i => i.owner === 'customer').forEach(item => {
        const el = buildPiece(item.val, item.fake, 'Cliente');
        el.style.transform = `rotate(${item.rot}deg)`;
        if (item.id === state.lastAddedId) el.classList.add('fresh');
        el.onclick = () => handleItemClick(item.id);
        custZone.appendChild(el);
      });

      // Tu cambio: agrupado por valor (de mayor a menor) con contador ×N
      const groups = {};
      state.itemsOnTable.filter(i => i.owner === 'player').forEach(i => {
        (groups[i.val] = groups[i.val] || []).push(i);
      });
      Object.keys(groups).map(Number).sort((a, b) => b - a).forEach(val => {
        const list = groups[val];
        const el = buildPiece(val, false, null);
        if (list.length > 1) {
          el.classList.add('stacked');
          el.insertAdjacentHTML('beforeend', `<div class="count-badge">×${list.length}</div>`);
        }
        if (list.some(i => i.id === state.lastAddedId)) el.classList.add('fresh');
        el.onclick = () => handleItemClick(list[list.length - 1].id);
        playerZone.appendChild(el);
      });
      state.lastAddedId = null; // solo se anima la pieza recién puesta
    }

    function handleItemClick(id) {
      if (!state.active) return;
      const idx = state.itemsOnTable.findIndex(i => i.id === id);
      if (idx === -1) return;
      const item = state.itemsOnTable[idx];

      if (item.owner === 'customer') {
        state.collectedFromCustomer = round2(state.collectedFromCustomer + item.val);
        playTone(680, 'sine', 0.06);
      } else {
        playTone(420, 'sine', 0.06);
      }
      state.itemsOnTable.splice(idx, 1);
      renderTable();
    }

    function addChange(val) {
      if (!state.active) return;
      spawnItemOnTable(val, 'player', false);
      playTone(val >= 5 ? 580 : 880, 'triangle', 0.05);
    }

    function clearMyChange() {
      if (!state.active) return;
      state.itemsOnTable = state.itemsOnTable.filter(i => i.owner !== 'player');
      renderTable();
      playTone(300, 'sawtooth', 0.07);
    }

    function nextClient() {
      clearInterval(state.timerId);
      clearTimeout(state.scamTimerId);
      hideHand();

      if (state.uvOn) toggleUV();

      const day = DAYS[state.dayIdx];
      state.clientInDay++;
      state.active = true;
      state.collectedFromCustomer = 0;
      state.itemsOnTable = [];
      state.hasFakeBill = false;
      state.fakeVal = 0;
      state.isScammer = false;

      const prod = pick(PRODUCTS);
      state.currentProduct = prod;

      document.getElementById('cust-avatar').textContent = pick(AVATARS);
      document.getElementById('prod-name').textContent = prod.name;
      document.getElementById('prod-price').textContent = fmt(prod.price);

      const roll = Math.random();
      const bigBill = pick([20, 50, 100]);
      let paid;
      let extraSeconds = 0;

      if (roll < day.fakeChance) {
        paid = bigBill;
        state.hasFakeBill = true;
        state.fakeVal = paid;
        spawnItemOnTable(paid, 'customer', true);
        if (state.upgrades.scanner) {
          setTimeout(() => playTone(1250, 'sine', 0.14, 0.15), 250);
        }
      } else if (roll < day.fakeChance + day.scamChance) {
        paid = bigBill;
        state.isScammer = true;
        spawnItemOnTable(paid, 'customer', false);
        extraSeconds = 6; // tiempo extra para lidiar con el timador
        scheduleScamTwist(paid);
      } else {
        paid = prod.price <= 2 ? pick([5, 10, 20]) : pick([10, 20, 50]);
        spawnItemOnTable(paid, 'customer', false);
      }
      document.getElementById('cust-speech').textContent = pick(PAY_LINES)(prod.name, paid);

      updateHUD();
      const seconds = day.baseTime + piecesFor(paid - prod.price) * SECONDS_PER_PIECE + extraSeconds;
      startTimer(seconds);
    }

    function scheduleScamTwist(initialBill) {
      // Cuanto más avanzada la semana, antes salta el timo
      const delay = 3600 - state.dayIdx * 250;
      state.scamTimerId = setTimeout(() => {
        if (!state.active) return;
        if (Math.random() < 0.52) {
          const extraCoin = pick([0.2, 0.5, 1, 2]); // monedas reales
          document.getElementById('cust-speech').textContent =
            `¡Espera! Tengo ${fmt(extraCoin)} sueltos, tómalos y devuélveme mejor el de ${initialBill} € que te di.`;
          spawnItemOnTable(extraCoin, 'customer', false);
        } else {
          document.getElementById('cust-speech').textContent =
            `Oye, ¿tienes bolsas de plástico ahí detrás? Mira a ver...`;
        }
        triggerThiefHand();
      }, delay);
    }

    function clearHandTimers() {
      state.handTimers.forEach(clearTimeout);
      state.handTimers = [];
    }

    function triggerThiefHand() {
      clearHandTimers();
      const hand = document.getElementById('thief-hand');
      hand.style.display = 'block';
      hand.className = 'tease';
      state.handState = 'tease';
      playTone(220, 'sawtooth', 0.12);

      const teaseDelay = state.upgrades.camera ? 1550 : 1050;
      const grabDelay = state.upgrades.camera ? 1050 : 720;

      state.handTimers.push(setTimeout(() => {
        if (!state.active || state.handState !== 'tease') return;
        hand.className = 'grab';
        state.handState = 'grab';

        state.handTimers.push(setTimeout(() => {
          if (!state.active || state.handState !== 'grab') return;
          if (state.itemsOnTable.length > 0) {
            // Se lleva la pieza más valiosa del mostrador
            let best = 0;
            state.itemsOnTable.forEach((it, i) => { if (it.val > state.itemsOnTable[best].val) best = i; });
            const stolen = state.itemsOnTable.splice(best, 1)[0];
            if (stolen.owner === 'player') {
              // Era dinero de TU caja: se pierde de verdad
              state.cash = round2(state.cash - stolen.val);
              updateHUD();
              showToast(`💸 ¡Te ha birlado ${fmt(stolen.val)} de tu cambio! (-${fmt(stolen.val)})`, '#ef4444');
            } else {
              showToast(`💸 ¡Ha recuperado su billete de ${fmt(stolen.val)}! Anula la venta 🛑`, '#ef4444');
            }
            renderTable();
            playTone(140, 'sawtooth', 0.25);
          }
          hideHand();
        }, grabDelay));
      }, teaseDelay));
    }

    function hideHand() {
      clearHandTimers();
      const hand = document.getElementById('thief-hand');
      hand.style.display = 'none';
      hand.className = '';
      state.handState = 'hidden';
    }

    document.getElementById('thief-hand').onclick = () => {
      if (!state.active || state.handState === 'hidden') return;
      hideHand();
      state.streak++;
      updateHUD();
      playTone(920, 'square', 0.08);
      document.getElementById('cust-speech').textContent = "¡Ay! Perdona, creía que ese billete era el mío...";
      showToast("✋ ¡PLAF! Mano frenada a tiempo (+Racha)", "#10b981");
    };

    function endClient() {
      state.active = false;
      clearInterval(state.timerId);
      clearTimeout(state.scamTimerId);
      hideHand();
    }

    function reportFake() {
      if (!state.active) return;
      endClient();

      if (state.hasFakeBill) {
        state.cash = round2(state.cash + 5);
        state.streak++;
        playTone(1040, 'triangle', 0.18);
        showToast("🕵️ ¡OJO CLÍNICO! Billete falso rechazado (+5,00 € bonus)", "#10b981");
      } else {
        state.cash = round2(state.cash - 10);
        state.streak = 0;
        playTone(150, 'sawtooth', 0.25);
        showToast("❌ Ese billete era auténtico. El cliente se va enfadado (-10,00 €)", "#ef4444");
      }
      updateHUD();
      advanceTurn();
    }

    // Anular: se devuelve al cliente lo cobrado, tu cambio vuelve al cajón y no se entrega el producto
    function cancelSale() {
      if (!state.active) return;
      endClient();

      if (state.hasFakeBill) {
        state.streak++;
        playTone(700, 'triangle', 0.15);
        showToast("🛑 Venta anulada: no aceptas su billete (falso). Sin pérdidas.<br><small>Con ¡BILLETE FALSO! te llevas +5,00 €</small>", "#10b981");
      } else if (state.isScammer) {
        state.streak++;
        playTone(1040, 'triangle', 0.15);
        showToast("🛑 ¡Venta anulada! El timador se va con las manos vacías (+Racha)", "#10b981");
      } else {
        state.cash = round2(state.cash - 3);
        state.streak = 0;
        playTone(150, 'sawtooth', 0.25);
        showToast("😠 Era un cliente honrado y se va sin comprar (-3,00 €)", "#ef4444");
      }
      updateHUD();
      advanceTurn();
    }

    function finishTransaction() {
      if (!state.active) return;
      endClient();

      if (state.hasFakeBill) {
        const fakeVal = state.fakeVal || 20;
        state.cash = round2(state.cash - fakeVal);
        state.streak = 0;
        playTone(130, 'sawtooth', 0.3);
        showToast(`🚨 ¡Te colaron un billete falso! Pierdes ${fmt(fakeVal)}`, "#ef4444");
        updateHUD();
        advanceTurn();
        return;
      }

      const customerOnTable = state.itemsOnTable
        .filter(i => i.owner === 'customer')
        .reduce((acc, i) => acc + i.val, 0);

      const playerOnTable = state.itemsOnTable
        .filter(i => i.owner === 'player')
        .reduce((acc, i) => acc + i.val, 0);

      const totalPaid = round2(state.collectedFromCustomer + customerOnTable);
      const expectedChange = round2(totalPaid - state.currentProduct.price);
      const diff = round2(playerOnTable - expectedChange);

      if (totalPaid < state.currentProduct.price) {
        const loss = round2(state.currentProduct.price - totalPaid + playerOnTable);
        state.cash = round2(state.cash - loss);
        state.streak = 0;
        playTone(140, 'sawtooth', 0.25);
        showToast(`😱 ¡Te ha faltado dinero por cobrar! Descuadre de -${fmt(loss)}`, "#ef4444");
      } else if (Math.abs(diff) < 0.01) {
        const mult = state.upgrades.tipjar ? 2 : 1;
        const tip = round2((0.6 + state.streak * 0.25) * mult);
        state.cash = round2(state.cash + tip);
        state.streak++;
        playTone(880, 'sine', 0.14);
        showToast(`✅ ¡Cambio clavado al céntimo! +${fmt(tip)} de propina`, "#10b981");
      } else if (diff > 0) {
        state.cash = round2(state.cash - diff);
        state.streak = 0;
        playTone(160, 'sawtooth', 0.25);
        showToast(`💸 ¡Le has dado ${fmt(diff)} de más! El timador sonríe...`, "#ef4444");
      } else {
        state.streak = 0;
        playTone(220, 'triangle', 0.2);
        showToast(`🤨 Le diste ${fmt(Math.abs(diff))} de menos (tocaba ${fmt(expectedChange)}). Se va protestando.`, "#f59e0b");
      }

      updateHUD();
      advanceTurn();
    }

    function startTimer(seconds) {
      state.timeLeft = 100;
      const bar = document.getElementById('timer-bar');
      bar.style.width = '100%';
      bar.style.background = '#10b981';
      if (state.relaxed) return; // sin reloj

      const total = state.upgrades.clock ? seconds * 1.25 : seconds;
      const step = 100 / (total * 10); // se descuenta cada 100 ms

      state.timerId = setInterval(() => {
        if (!state.active) return;
        state.timeLeft -= step;
        bar.style.width = Math.max(0, state.timeLeft) + '%';
        bar.style.background = state.timeLeft > 40 ? '#10b981' : (state.timeLeft > 20 ? '#f59e0b' : '#ef4444');

        if (state.timeLeft <= 0) {
          endClient();
          state.cash = round2(state.cash - 5);
          state.streak = 0;
          updateHUD();
          showToast("⏰ ¡Demasiado lento! El cliente se cansó (-5,00 €)", "#ef4444");
          advanceTurn();
        }
      }, 100);
    }

    function advanceTurn() {
      saveRecords(state.cash, state.streak, false);

      if (state.cash <= 0) {
        setTimeout(() => {
          const ov = document.getElementById('overlay');
          ov.innerHTML = `
            <div class="modal">
              <h1 style="color:#ef4444;">💥 CAJA ARRUINADA</h1>
              <p>Te han dejado la caja en números rojos el <b>${DAYS[state.dayIdx].name}</b>.</p>
              <button class="btn btn-done" style="width:100%; margin-top:12px;" onclick="showStartModal()">VOLVER AL MENÚ</button>
            </div>
          `;
          ov.style.display = 'flex';
        }, 1600);
        return;
      }

      const day = DAYS[state.dayIdx];
      if (state.clientInDay >= day.clients) {
        setTimeout(showEndOfDayShop, 1650);
      } else {
        setTimeout(nextClient, 1700);
      }
    }

    function showEndOfDayShop() {
      const day = DAYS[state.dayIdx];
      const profit = +(state.cash - state.dayStartCash).toFixed(2);

      if (state.dayIdx >= DAYS.length - 1) {
        saveRecords(state.cash, state.streak, true);
        const ov = document.getElementById('overlay');
        ov.innerHTML = `
          <div class="modal">
            <h1 style="color:#10b981;">🏆 ¡SEMANA SUPERADA!</h1>
            <p>Has cerrado el Domingo con <b>${fmt(state.cash)}</b> en caja y una racha máxima de <b>${state.streak}</b>.</p>
            <button class="btn btn-done" style="width:100%; margin-top:12px;" onclick="showStartModal()">NUEVA SEMANA</button>
          </div>
        `;
        ov.style.display = 'flex';
        return;
      }

      const nextDay = DAYS[state.dayIdx + 1];
      const ov = document.getElementById('overlay');

      const renderShopHTML = () => {
        const cards = UPGRADES.map(u => {
          const owned = !!state.upgrades[u.id];
          const canBuy = !owned && state.cash > u.cost + 20;
          return `
            <div class="shop-card ${owned ? 'owned' : ''}">
              <div>
                <h4>${u.name}</h4>
                <small>${u.desc}</small>
              </div>
              <button class="btn ${owned ? 'btn-uv' : 'btn-done'}"
                style="padding:6px 8px; font-size:0.78rem;"
                ${owned || !canBuy ? 'disabled' : ''}
                onclick="buyUpgrade('${u.id}')">
                ${owned ? '✅ Instalado' : `Comprar (${u.cost} €)`}
              </button>
            </div>
          `;
        }).join('');

        ov.innerHTML = `
          <div class="modal">
            <h1>🧾 Cierre del ${day.name}</h1>
            <p>Balance del día: <b style="color:${profit >= 0 ? '#10b981' : '#ef4444'}">${profit >= 0 ? '+' : ''}${fmt(profit)}</b> · Caja actual: <b>${fmt(state.cash)}</b></p>
            <div class="shop-grid">${cards}</div>
            <button class="btn btn-done" style="width:100%;" onclick="startNextDay()">ABRIR ${nextDay.name.toUpperCase()} (${nextDay.desc})</button>
          </div>
        `;
      };

      window.buyUpgrade = (id) => {
        const upg = UPGRADES.find(u => u.id === id);
        if (!upg || state.upgrades[id] || state.cash <= upg.cost + 20) return;
        state.cash = +(state.cash - upg.cost).toFixed(2);
        state.upgrades[id] = true;
        playTone(960, 'triangle', 0.15);
        updateHUD();
        renderShopHTML();
      };

      renderShopHTML();
      ov.style.display = 'flex';
    }

    function startNextDay() {
      state.dayIdx++;
      state.clientInDay = 0;
      state.dayStartCash = state.cash;
      document.getElementById('overlay').style.display = 'none';
      nextClient();
    }

    showStartModal();
  </script>
</body>
</html>
